<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Magician - Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="logo">Math Magician</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="calculator.html" class="active">Calculator</a>
            <a href="quote.html">Quote</a>
            
        </nav>
    </header>

    <!-- Calculator Page -->
    <main class="calculator-page">

        <div class="calculator-title">
            Lets Do Some Math...
        </div>

        <div class="calculator">

            <!-- Display -->
            <div class="display" id="display">
                0
                <div class=""></div>
            </div>

            <!-- Buttons -->
            <div class="buttons">

                <button onclick="clearDisplay()">AC</button>
                <button onclick="plusMinus()">+/-</button>
                <button onclick="percent()">%</button>
                <button class="operator" onclick="chooseOperator('/')">÷</button>
                



                <button onclick="inputNumber('7')">7</button>
                <button onclick="inputNumber('8')">8</button>
                <button onclick="inputNumber('9')">9</button>
                <button class="operator" onclick="chooseOperator('*')">x</button>

                <button onclick="inputNumber('4')">4</button>
                <button onclick="inputNumber('5')">5</button>
                <button onclick="inputNumber('6')">6</button>
                <button class="operator" onclick="chooseOperator('-')">-</button>

                <button onclick="inputNumber('1')">1</button>
                <button onclick="inputNumber('2')">2</button>
                <button onclick="inputNumber('3')">3</button>
                <button class="operator" onclick="chooseOperator('+')">+</button>

                <button class="zero" onclick="inputNumber('0')">0</button>
                <button onclick="inputDecimal()">.</button>
                <button class="operator" onclick="calculate()">=</button>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
